name: Backend CI

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER
# Runs when code inside backend/ is pushed or a PR is opened.
# Does NOT run on frontend-only changes — same path filtering as frontend-ci.yml.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

# ─────────────────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-checks:
    name: Lint and Test
    runs-on: ubuntu-latest

    # Every `run:` step starts inside the backend/ folder automatically.
    defaults:
      run:
        working-directory: ./backend

    steps:

      # ── STEP 1 ──────────────────────────────────────────────────────────────
      # Clone the repository onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── STEP 2 ──────────────────────────────────────────────────────────────
      # Install Python 3.11.
      # cache: 'pip' remembers downloaded packages between runs — faster CI.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # ── STEP 3 ──────────────────────────────────────────────────────────────
      # Install all Python packages listed in requirements.txt.
      # We upgrade pip first to avoid outdated pip warnings.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── STEP 4 ──────────────────────────────────────────────────────────────
      # Run Ruff — a fast Python linter.
      # Checks for unused imports, undefined variables, bad style.
      # ruff.toml in the backend/ folder controls which rules apply
      # and which folders (like venv/) are excluded.
      - name: Lint with Ruff
        run: ruff check .

      # ── STEP 5 ──────────────────────────────────────────────────────────────
      # Run all tests with pytest.
      # -v           → verbose output (shows each test name)
      # --tb=short   → shows only the relevant part of a traceback on failure
      # --cov=app    → measures how much of app/ code is covered by tests
      - name: Run tests with pytest
        run: |
          pytest tests/ \
            --verbose \
            --tb=short \
            --cov=app \
            --cov-report=term-missing
